# The live image ships without SSH host keys (live-build removes them), so the installed system
# creates its own. Debian's unit checks the config first, which fails without keys, so the key step
# has to come before that check.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
