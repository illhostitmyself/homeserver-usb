<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Home Server</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f4efe6; color: #2f5d62;
         font: 2.2rem/1.4 sans-serif; text-align: center; }
  p { max-width: 32ch; }
  small { display: block; margin-top: 1.5rem; font-size: 1.4rem; opacity: .7; }
</style>

<script>
  setInterval(() => fetch("http://localhost/", { mode: "no-cors" }).then(() => location.href = "http://localhost/", () => {}), 3000);
</script>
</html>
