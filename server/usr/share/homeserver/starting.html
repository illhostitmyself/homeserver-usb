<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Home Server</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #ffffff; color: #253457;
         font: 2.2rem/1.4 sans-serif; text-align: center; }
  p { max-width: 32ch; }
  small { display: block; margin-top: 1.5rem; font-size: 1.4rem; opacity: .7; }
</style>
<p>Your home server is getting ready.<small>The first start can take 10 minutes. This page changes by itself when it's done.</small></p>
<script>
  // Opens the dashboard as http://<name>.local/, the address every device uses. If that name doesn't
  // answer for a minute while the dashboard does, localhost.
  const host = new URLSearchParams(location.search).get("host");
  const named = host ? `http://${host}.local/` : "http://localhost/";
  let misses = 0;
  const open = url => fetch(url, { mode: "no-cors" }).then(() => { location.href = url; return true; }, () => false);
  setInterval(async () => {
    if (await open(named)) return;
    if (++misses >= 20) open("http://localhost/");
  }, 3000);
</script>
</html>
