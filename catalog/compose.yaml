# Every app has its own profile; the installer lists the picked ones in COMPOSE_PROFILES
# (/etc/homeserver/homeserver.env). Images are pulled during install, or on first boot if offline.
# Every image is pinned to a version and digest; a catalog release is what moves them.
# SRV is /srv, except during install when the new disk is mounted somewhere else.
# Folder layout follows the TRaSH Guides: one /data mount so imports are instant hardlinks.
#   /data/torrents/{movies,tv,books,audiobooks}    qBittorrent downloads, by category
#   /data/usenet/{incomplete,complete/...}         SABnzbd downloads, by category
#   /data/media/{movies,tv,books,audiobooks,podcasts}  the libraries
# The homepage.* labels put each app on the dashboard.
name: homeserver

x-linuxserver: &linuxserver
  restart: unless-stopped
  environment: &env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    profiles: [homepage]
    restart: unless-stopped
    ports: ["80:3000"]
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
    volumes:
      - ${SRV}/appdata/homepage:/app/config
      - ${SRV}/appdata/homepage/images:/app/public/images:ro
      - ${SRV}:/srv:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    profiles: [filebrowser]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports: ["8085:80"]
    volumes:
      - ${SRV}/data:/srv
      - ${SRV}/appdata/filebrowser/database:/database
      - ${SRV}/appdata/filebrowser/config:/config
    labels:
      homepage.group: Files
      homepage.name: Files
      homepage.icon: filebrowser.png
      homepage.href: http://${HOMESERVER_HOST}:8085
      homepage.description: Browse, upload and download your files

  jellyfin:
    <<: *linuxserver
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls59@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
    profiles: [jellyfin]
    ports: ["8096:8096"]
    volumes:
      - ${SRV}/appdata/jellyfin:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Watch
      homepage.name: Movies & TV
      homepage.icon: jellyfin.png
      homepage.href: http://${HOMESERVER_HOST}:8096
      homepage.description: Watch your movies and shows
      homepage.widget.type: jellyfin
      homepage.widget.url: http://jellyfin:8096
      homepage.widget.key: ${JELLYFIN_KEY:-}
      homepage.widget.enableBlocks: "true"
      homepage.widget.enableNowPlaying: "true"
      homepage.widget.version: "2"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2@sha256:aadee014b40e28cf9aa4928bc9d1183a6eb08f8c44d543cddc9efdcb16549be2
    profiles: [seerr]
    restart: unless-stopped
    init: true
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports: ["5055:5055"]
    volumes:
      - ${SRV}/appdata/seerr:/app/config
    labels:
      homepage.group: Watch
      homepage.name: Request a movie or show
      homepage.icon: jellyseerr.png
      homepage.href: http://${HOMESERVER_HOST}:5055
      homepage.description: Seerr
      homepage.widget.type: jellyseerr
      homepage.widget.url: http://seerr:5055
      homepage.widget.key: ${SEERR_KEY:-}

  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5@sha256:c7d1df25e428da6c9ace05daea0d34e59522978a3843ea1944812f855af4086c
    profiles: [sonarr]
    ports: ["8989:8989"]
    volumes:
      - ${SRV}/appdata/sonarr:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: TV shows
      homepage.icon: sonarr.png
      homepage.href: http://${HOMESERVER_HOST}:8989
      homepage.description: Sonarr
      homepage.widget.type: sonarr
      homepage.widget.url: http://sonarr:8989
      homepage.widget.key: ${SONARR_KEY}

  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    profiles: [radarr]
    ports: ["7878:7878"]
    volumes:
      - ${SRV}/appdata/radarr:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: Movies
      homepage.icon: radarr.png
      homepage.href: http://${HOMESERVER_HOST}:7878
      homepage.description: Radarr
      homepage.widget.type: radarr
      homepage.widget.url: http://radarr:7878
      homepage.widget.key: ${RADARR_KEY}

  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
    profiles: [prowlarr]
    ports: ["9696:9696"]
    volumes:
      - ${SRV}/appdata/prowlarr:/config
    labels:
      homepage.group: Downloads
      homepage.name: Download sources
      homepage.icon: prowlarr.png
      homepage.href: http://${HOMESERVER_HOST}:9696
      homepage.description: Prowlarr. Add your indexers here
      homepage.widget.type: prowlarr
      homepage.widget.url: http://prowlarr:9696
      homepage.widget.key: ${PROWLARR_KEY}

  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    profiles: [qbittorrent]
    environment:
      <<: *env
      WEBUI_PORT: 8080
    ports: ["8080:8080", "6881:6881", "6881:6881/udp"]
    volumes:
      - ${SRV}/appdata/qbittorrent:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: Downloads in progress
      homepage.icon: qbittorrent.png
      homepage.href: http://${HOMESERVER_HOST}:8080
      homepage.description: qBittorrent

  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls372@sha256:832820dec70bce9e912c6eee7a95baf6551e03dbc63325a7208daaa455423752
    profiles: [bazarr]
    ports: ["6767:6767"]
    volumes:
      - ${SRV}/appdata/bazarr:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: Subtitles
      homepage.icon: bazarr.png
      homepage.href: http://${HOMESERVER_HOST}:6767
      homepage.description: Bazarr
      homepage.widget.type: bazarr
      homepage.widget.url: http://bazarr:6767
      homepage.widget.key: ${BAZARR_KEY:-}

  chaptarr:
    image: chaptarr/chaptarr:latest@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
    profiles: [chaptarr]
    restart: unless-stopped
    environment: *env
    ports: ["8789:8789"]
    volumes:
      - ${SRV}/appdata/chaptarr:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: Books & audiobooks
      homepage.icon: readarr.png
      homepage.href: http://${HOMESERVER_HOST}:8789
      homepage.description: Chaptarr

  sabnzbd:
    <<: *linuxserver
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls281@sha256:b356d0a9b22db584e9005364ec4e752dfc081ce501b7145e9a5c0bb38e4d1ba4
    profiles: [sabnzbd]
    ports: ["8090:8080"]
    volumes:
      - ${SRV}/appdata/sabnzbd:/config
      - ${SRV}/data:/data
    labels:
      homepage.group: Downloads
      homepage.name: Usenet downloads
      homepage.icon: sabnzbd.png
      homepage.href: http://${HOMESERVER_HOST}:8090
      homepage.description: SABnzbd. Add your Usenet provider here
      homepage.widget.type: sabnzbd
      homepage.widget.url: http://sabnzbd:8080
      homepage.widget.key: ${SABNZBD_KEY}

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    profiles: [audiobookshelf]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    ports: ["13378:80"]
    volumes:
      - ${SRV}/appdata/audiobookshelf/config:/config
      - ${SRV}/appdata/audiobookshelf/metadata:/metadata
      - ${SRV}/data:/data
    labels:
      homepage.group: Watch
      homepage.name: Audiobooks & podcasts
      homepage.icon: audiobookshelf.png
      homepage.href: http://${HOMESERVER_HOST}:13378
      homepage.description: Audiobookshelf
      homepage.widget.type: audiobookshelf
      homepage.widget.url: http://audiobookshelf:80
      homepage.widget.key: ${AUDIOBOOKSHELF_KEY:-}

  # Syncs the TRaSH Guides quality profiles, custom formats and naming into Sonarr and Radarr daily.
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    profiles: [recyclarr]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: "@daily"
    volumes:
      - ${SRV}/appdata/recyclarr:/config

  # Joins the server to the owner's tailnet. Host networking, so every app answers on the Tailscale
  # address too; the login link is shown on the Cockpit Apps page (catalog.sh remote status).
  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    profiles: [tailscale]
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
    volumes:
      - ${SRV}/appdata/tailscale:/var/lib/tailscale
