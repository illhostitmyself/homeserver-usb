---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: apps
    module: shellprocess
    config: shellprocess-apps.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - netinstall
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - dpkg-unsafe-io
      - sources-media
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - bootloader-config
      - grubcfg
      - bootloader
      - homeserver
      - packages
      - shellprocess@apps
      - initramfscfg
      - initramfs
      - dpkg-unsafe-io-undo
      - sources-media-unmount
      - sources-final
      - umount
  - show:
      - finished

branding: homeserver
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
