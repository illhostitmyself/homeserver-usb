---
# The app checklist. Each "package" is an app name that the homeserver step (main.py) turns into
# the app list and removes, so apt never sees it. Names here must match APPS in main.py.
# Apps another app depends on are added automatically, which the descriptions say.
required: false
label:
  sidebar: "Apps"
  title: "Pick your apps. Everything is ticked; untick what you don't want."
groupsUrl: local
groups:
  - name: "Always installed"
    description: "Part of the server itself"
    selected: true
    immutable: true
    expanded: true
    packages:
      - name: "Homepage"
        description: "The dashboard with a tile for every app. Shown full screen on this computer"
      - name: "Cockpit"
        description: "Server settings in the browser: updates, disks, restart, shut down"
      - name: "Automatic security updates"
        description: "Keeps the system patched without you doing anything"

  - name: "Files"
    description: "Get files on and off the server"
    selected: true
    expanded: true
    packages:
      - name: "File Browser"
        description: "Browse, upload and download files from any browser"
      - name: "Shared folder"
        description: "A network folder that shows up on Windows and Mac"

  - name: "Watch and listen"
    description: "Your own streaming services"
    selected: true
    expanded: true
    packages:
      - name: "Jellyfin"
        description: "Movies and TV shows on your TV, phone or computer"
      - name: "Seerr"
        description: "Ask for a movie or show by name. Adds Jellyfin, plus Sonarr and Radarr if neither is picked"
      - name: "Audiobookshelf"
        description: "Audiobooks, ebooks and podcasts, with a phone app"

  - name: "Automatic downloads"
    description: "Find, download and file things for you. You add your own sources in Prowlarr and SABnzbd"
    selected: true
    expanded: true
    packages:
      - name: "Sonarr"
        description: "TV shows. Adds qBittorrent if no downloader is picked"
      - name: "Radarr"
        description: "Movies. Adds qBittorrent if no downloader is picked"
      - name: "Chaptarr"
        description: "Books and audiobooks. Adds qBittorrent if no downloader is picked"
      - name: "Prowlarr"
        description: "Download sources, shared with Sonarr, Radarr and Chaptarr"
      - name: "Bazarr"
        description: "Subtitles for your movies and shows"
      - name: "Recyclarr"
        description: "Keeps Sonarr and Radarr on the TRaSH Guides quality settings (needs internet)"
      - name: "qBittorrent"
        description: "Torrent downloader"
      - name: "SABnzbd"
        description: "Usenet downloader. You add your own Usenet provider in it"
