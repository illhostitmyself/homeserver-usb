---
# The app checklist. Each "package" is a marker (homeserver-app-<id>) that the homeserver step
# turns into the app list and removes, so nothing is installed with apt.
required: false
label:
  sidebar: "Apps"
  title: "Which apps do you want? Untick anything you don't need."
groupsUrl: local
groups:
  - name: "Movies & TV (Jellyfin)"
    description: "Your own Netflix: watch your movies and shows on the TV, phone or computer."
    selected: true
    packages: [ homeserver-app-jellyfin ]
  - name: "Shared folder"
    description: "A folder that shows up on your Windows or Mac computer."
    selected: true
    packages: [ homeserver-app-files ]
  - name: "Automatic downloads (Sonarr, Radarr, Prowlarr, qBittorrent)"
    description: "Finds and downloads shows and movies and files them for Jellyfin."
    selected: true
    packages: [ homeserver-app-downloads ]
  - name: "Request page (Seerr)"
    description: "Ask for a movie or show by name. Also needs the two apps above."
    selected: true
    packages: [ homeserver-app-requests ]
