---
userGroup: users
defaultGroups: [ cdrom, sudo, audio, video, plugdev, netdev ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
passwordRequirements:
  nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, kiosk, admin ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "homeserver"
  forbidden_names: [ localhost ]
