---
userGroup: users
defaultGroups: [ cdrom, sudo, audio, video, plugdev, netdev ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
# Every app gets this password. A few of them refuse common passwords, so the dictionary check
# stops those here, where the message can be read and acted on.
passwordRequirements:
  nonempty: true
  minLength: 6
  libpwquality:
    - minlen=6
    - minclass=0
    - dictcheck=1
allowWeakPasswords: false
user:
  shell: /bin/bash
  forbidden_names: [ root, kiosk, admin ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "homeserver"
  forbidden_names: [ localhost ]
