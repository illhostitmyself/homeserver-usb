---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 64MiB
  label: "EFI"
# Swap is a partition in the layout below; Calamares' own swap option is ignored with a layout.
userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: erase
allowManualPartitioning: false
enableLuksAutomatedPartitioning: false
showNotEncryptedBootMessage: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
# /srv holds the media and app data, so a reinstall of / never touches it.
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
  - name: "swap"
    filesystem: "linuxswap"
    size: 4GiB
  - name: "root"
    filesystem: "ext4"
    mountPoint: "/"
    size: 30%
    minSize: 20GiB
    maxSize: 50GiB
  - name: "home"
    filesystem: "ext4"
    mountPoint: "/home"
    size: 10%
    minSize: 5GiB
    maxSize: 10GiB
  - name: "srv"
    filesystem: "ext4"
    mountPoint: "/srv"
    size: 100%
    minSize: 20GiB
