---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 64MiB
  label: "EFI"
# Swap is a partition in the layout below; Calamares' own swap option is ignored with a layout.
userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: erase
# GPT on BIOS too: the layout below has five partitions, more than MBR's four primary ones.
defaultPartitionTableType: gpt
allowManualPartitioning: true
enableLuksAutomatedPartitioning: false
showNotEncryptedBootMessage: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4" ]
# /srv holds the app settings and media, so a reinstall of / never touches it. Extra drives
# picked in the installer are pooled with it (setup-drives.sh). The names show in the legend.
partitionLayout:
  - name: "boot"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1GiB
  - name: "swap"
    filesystem: "linuxswap"
    size: 4GiB
  - name: "system"
    filesystem: "ext4"
    mountPoint: "/"
    size: 30%
    minSize: 20GiB
    maxSize: 50GiB
  - name: "home"
    filesystem: "ext4"
    mountPoint: "/home"
    size: 10%
    minSize: 5GiB
    maxSize: 10GiB
  - name: "apps-and-media"
    filesystem: "ext4"
    mountPoint: "/srv"
    size: 100%
    minSize: 20GiB
