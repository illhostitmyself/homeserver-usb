---
# "Update this server": a second Calamares flow, used instead of the installer when a disk already
# has Home Server on it. update-setup.sh runs it with XDG_CONFIG_DIRS=/etc/calamares-update and -X,
# so this file and modules/ are found first. update-setup.sh also makes the homeserver-update
# branding: the installer's, with its own slideshow.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: server
    module: notesqml
    config: notesqml-server.conf

sequence:
  - show:
      - notesqml@server
  - exec:
      - homeserverupdate
  - show:
      - finishedq

branding: homeserver-update
prompt-install: false
dont-chroot: true
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
